# /etc/nginx/conf.d/load-balancer.conf
upstream phase_servers {
    # Round-robin is the default method
    server 127.0.0.1:8081;
    server 127.0.0.1:8082;
    server 127.0.0.1:8083;
}

server {
    listen 80 default_server;
    server_name _;

    # Browsers ask for /favicon.ico on every visit. Without this rule each
    # favicon request consumes one round-robin turn and the pages seem to skip.
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    location / {
        proxy_pass http://phase_servers;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stop browsers and proxies from caching a page, so every
        # refresh reaches the load balancer and moves to the next phase
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
